[project]
name = "hubmi"
version = "0.1.0"
description = "HubMi: social innovation matchmaking for the Malopolska Social Innovation Hub"
authors = [
    { name = "h" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "dishka>=1.10.1",
    "fastapi>=0.139.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pydantic-ai-slim[google]>=2.15.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
    "selectolax>=0.4.13",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.50.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["api", "utils", "dependencies", "services"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY", "D1", "D203", "D212", "COM812", "BLE", "S101", "PT", "RUF001", "RUF002", "RUF003", "TRY301"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["INP", "T201", "ANN401"]
"tests/*" = ["INP", "S101", "PLR2004", "ANN401"]
"*.lock" = ["ALL"]
"migrations/**" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
